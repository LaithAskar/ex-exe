<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="hud">
      <div id="nameplate"><span id="name">VEX</span> <span id="lv">LV 99 EX</span></div>
      <div id="hp"><span class="hplabel">♥</span><div id="hpbar"><div id="hpfill"></div></div><span id="hpnum">90</span></div>
      <div id="status">STATUS: <span id="mood">CHILL</span></div>
    </div>
    <div id="spritewrap">
      <div id="fx"></div>
      <canvas id="sprite" width="20" height="22"></canvas>
    </div>
    <div id="box">
      <div id="tag">VEX</div>
      <div id="text"></div>
      <div id="caret">▼</div>
      <div id="buttons">
        <button id="ack">[ ok ok ]</button>
        <button id="sorry">[ sorry ]</button>
      </div>
      <div id="app">watching: <span id="appname">…</span></div>
    </div>
  </div>
  <script src="sprite.js"></script>
  <script src="app.js"></script>
</body>
</html>
